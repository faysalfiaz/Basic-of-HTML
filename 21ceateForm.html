<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 style="text-align: center;">SIGN UP FORM</h1>
    <hr><hr></body></html>
    <br>
    <label for="user">Name :</label>
    <input type="text" id="user" name="user" placeholder="User Name">
    <br>
    <br>
    <label for="Email">Email :</label>
    <input type="Email" id="Email" name="Usermail" required placeholder="User Email">
    <br>
    <br>
    <label for="pass">Password :</label>
    <input type="Password" id="pass" name="UserPassword" required placeholder="User Password 123">
    <br>
    <br>
    <label for="Phone">Phone Number :</label>
    <br>
    <br>
    <select name="code">
        <option value="+880">+880</option>
        <option value="+990">+990</option>
        <option value="+110">+110</option>
    </select>
    <input type="Phone" id="Phone" name="UserPhone" required placeholder="114536434">
    <br>
    <br>
    <label for="country">Country  :</label>
    <input list="con" id="country" name="country" required >
    <datalist id="con">
        <option value="Bangladesh"></option>
        <option value="China"></option>
        <option value="canada"></option>
    </datalist>
    <br><br>
    <input type="radio" id="gnd1" name="Gender" value="Male">
    <label for="gnd1">Male</label>

    <input type="radio" id="gnd2" name="Gender" value="Female">
    <label for="gnd2">Female</label>
    <br><br>
    <label for="date"> Date Of Birth :</label>
    <input type="date" id="date" name="dob">
    <br><br>
    <label for="time">Time :</label>
    <input type="time" id="time" name="time">
    <br><br>
    <label for="colors">Colors :</label>
    <input type="color" id="colors" name="colors">
    <br><br>
    <label for="file">Choose Photo </label>
    <input type="file" id="file" name="file">
    <br><br>
    <input type="checkbox" id="bike" name="verh">
    <label for="bike">I have a Bike</label>

    <input type="checkbox" id="car" name="verh">
    <label for="car">I have a Car</label>
    <br><br>
    <textarea name="Comment" cols="30" rows="10"> Comment Here </textarea>
    <br><br>
    <input type="submit" value="Send">
    <input type="Reset" value="Reset">
</body>

</html>
